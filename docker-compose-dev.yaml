version: '3.9'

services:
  front-react:
    build:
      context: ./client
    environment:
      NODE_ENV: development
    depends_on:
      - server-dev
    volumes:
      - ./client:/client
      - /client/node_modules
    ports:
      - "3000:3000"

  server-dev:
    build:
      context: ./server
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db-dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squadhelp-dev
      MONGO_URL: mongodb://mongo-dev:27017/squadhelp
    depends_on:
      db-dev:
        condition: service_healthy
      mongo-dev:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./server:/server
      - ./var/www/html/images:/var/www/html/images
      - /server/node_modules

  mongo-dev:
    image: mongo:4.4.6-bionic
    ports:
      - "27017:27017"

  db-dev:
    image: postgres:13.2-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: squadhelp-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

